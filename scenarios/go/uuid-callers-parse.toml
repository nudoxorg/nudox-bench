# Verified by reading github.com/google/uuid@v1.6.0:
#   uuid.go:167  MustParse           -> Parse(s)
#   sql.go:27    (*UUID).Scan        -> Parse(src)
#   hash.go:15-18 package-level vars -> Must(Parse(...))
id = "go/uuid/callers-parse"
family = "polyglot"
task = "callers"
question = "In github.com/google/uuid, what calls the package-level Parse function?"

[target]
ecosystem = "go"
package = "github.com/google/uuid"
version = "v1.6.0"
root = "${GO_MOD}/github.com/google/uuid@v1.6.0"

[probe]
name = "Parse"
symbol = "uuid.Parse"
query = "Parse"
kind = "function"

[truth]
mode = "symbol_set"
all_of = ["MustParse", "Scan"]
none_of = ["ParseBytes"]

[budget]
max_tool_calls = 4
token_budget = 4000

notes = """
`ParseBytes` is the distractor: it is an adjacent exported function whose name contains `Parse`, and it does **not** call `Parse` — it has its own parsing path. A text search for `Parse(` returns it; a resolved reference index should not.

The four `NameSpace*` package-level vars in hash.go also call `Parse`, inside variable initializers rather than functions. They are omitted from all_of because whether an index attributes a reference to an initializer is a defensible design choice either way, and a scenario should not score a tool on one."""
