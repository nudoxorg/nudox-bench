notes = """
This is the scenario neither baseline can attempt, and that is the point. ripgrep and rust-analyzer both answer about the checkout they were given; comparing two released versions requires a corpus that holds both at once. Both adapters decline it explicitly rather than scoring zero, so the report shows it as reach rather than as a win on points.

Both versions must be loaded into the Nudox corpus for the `diff` tool to answer — see `--ensure-indexed` in docs/RUNNING.md."""
