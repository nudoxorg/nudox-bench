# Ground truth derived by reading itertools-0.15.0 directly. `Interleave` is
# public only through a re-export: `pub use crate::adaptors::{..., Interleave,
# InterleaveShortest, ...}` inside `pub mod structs` (src/lib.rs:94, the use at
# :97-101), while `mod adaptors` is private (src/lib.rs:180). The declaration is
#   pub struct Interleave<I, J> {      src/adaptors/mod.rs:28
# and `InterleaveShortest` is a separate struct at src/adaptors/mod.rs:123.
id = "rust/itertools/definition-interleave-reexport"
family = "retrieval"
task = "definition"
question = """
Where is `itertools::structs::Interleave` actually declared, and what does the declaration look like?"""
notes = """
A re-export question: the public path (`itertools::structs::Interleave`) names a module that only re-exports, and the declaring module is private. The re-export line lists `Interleave` and `InterleaveShortest` side by side, so an answer that stops at the `pub use` leaks the distractor; the declaration itself does not mention it. Word boundaries keep `Interleave` from matching inside `InterleaveShortest`."""

[target]
ecosystem = "crates.io"
package = "itertools"
version = "0.15.0"
root = "${CARGO_SRC}/itertools-0.15.0"

[probe]
name = "Interleave"
symbol = "itertools::adaptors::Interleave"
query = "Interleave"
kind = "struct"

[truth]
mode = "literal"
all_of = ["adaptors/mod.rs", "pub struct Interleave<I, J>"]
none_of = ["InterleaveShortest"]

[budget]
max_tool_calls = 3
token_budget = 3000
