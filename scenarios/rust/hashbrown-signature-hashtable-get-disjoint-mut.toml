Same name, different type, different signature: `HashMap::get_disjoint_mut` is keyed by borrowed keys, `HashTable::get_disjoint_mut` by precomputed hashes plus an equality closure. The distractor is the HashMap parameter spelling. RawTable also has a `get_disjoint_mut` (crate-private) whose parameters match HashTable's; it is not scored."""

