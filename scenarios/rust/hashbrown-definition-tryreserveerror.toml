# Verified against hashbrown 0.17.1, src/lib.rs:163-174. The enum has exactly
# two variants: CapacityOverflow, and AllocError { layout }.
id = "rust/hashbrown/definition-tryreserveerror"
family = "retrieval"
task = "definition"
question = """
What are the variants of hashbrown's `TryReserveError`?"""

[target]
ecosystem = "crates.io"
package = "hashbrown"
version = "0.17.1"
root = "${CARGO_SRC}/hashbrown-0.17.1"

[probe]
name = "TryReserveError"
symbol = "hashbrown::TryReserveError"
query = "hashbrown TryReserveError variants"
kind = "enum"

[truth]
mode = "symbol_set"
all_of = ["CapacityOverflow", "AllocError"]

[budget]
max_tool_calls = 3
token_budget = 4000

notes = """
hashbrown carries five of the corpus's fourteen scenarios' worth of Rust weight on its own otherwise only through a diff question that every file-based adapter declines, so before this it was effectively unexercised. This one is deliberately plain: a two-variant enum declared once, with the answer inside twelve lines of its declaration.

It is here for package diversity rather than difficulty. Six of the scenarios target memchr, and a benchmark that draws most of its Rust evidence from one small crate is measuring that crate's shape as much as the tools.

Worth noting what it produced on first run: ripgrep passes at 601 tokens with strict recall 1.00 and **matched recall 0.00**. It greps the declaration and reads the variants out of the lines printed after it, so every fact in the answer arrived as context rather than as something the tool matched. That is the widest strict-versus-matched split in the corpus, and it is the cleanest illustration of why the two are reported separately."""
