# Ground truth derived by reading itertools-0.15.0 directly:
#   rg -n 'impl.*PeekingNext for' src/
# `PeekingNext` is declared at src/peeking_take_while.rs:15. The types this
# crate itself defines that implement it are:
#   PeekNth          src/peek_nth.rs:167
#   MultiPeek        src/multipeek_impl.rs:68
#   PutBack          src/peeking_take_while.rs:54
#   PutBackN         src/peeking_take_while.rs:75
#   RepeatN          src/peeking_take_while.rs:146
#   PeekingTakeWhile src/peeking_take_while.rs:202
# The rest are std types (Peekable :37, vec::IntoIter :96, ... and the
# `peeking_next_by_clone!` macro invocations at :238-274).
# `TakeWhileRef` (src/adaptors/mod.rs:513) and `TakeWhileInclusive`
# (src/take_while_inclusive.rs:12) implement Iterator only; the docs of
# `peeking_take_while` (src/lib.rs:1786) call take_while_ref "a similar adaptor".
id = "rust/itertools/implementors-peeking-next"
family = "retrieval"
task = "implementors"
question = """
Which of itertools' own iterator types implement the `PeekingNext` trait?"""
notes = """
Hard. Most implementations are for std types, and twenty of them are generated by the `peeking_next_by_clone!` macro, so a text search for `impl PeekingNext for` sees the macro body once and none of its expansions. Only the crate's own types are scored; the std impls are in neither list because whether they count as "itertools' types" is a reading of the question. The distractors are the adaptors the documentation sets beside `peeking_take_while` that do not implement the trait."""

[target]
ecosystem = "crates.io"
package = "itertools"
version = "0.15.0"
root = "${CARGO_SRC}/itertools-0.15.0"

[probe]
name = "PeekingNext"
symbol = "itertools::PeekingNext"
query = "PeekingNext"
kind = "trait"

[truth]
mode = "symbol_set"
all_of = ["PeekNth", "MultiPeek", "PutBack", "PutBackN", "RepeatN", "PeekingTakeWhile"]
none_of = ["TakeWhileRef", "TakeWhileInclusive"]

[budget]
max_tool_calls = 4
token_budget = 5000
