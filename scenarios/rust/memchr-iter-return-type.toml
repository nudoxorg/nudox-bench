notes = """
A one-word answer. The interesting number here is not whether a system finds it — all of them should — but what it spends doing so. The 800-token budget is roughly what the answer is worth; anything far above it is paying source-dump prices for a signature lookup.

`none_of` holds the two sibling iterator types, so an adapter that answers by returning the whole iterator module is marked down rather than credited."""
